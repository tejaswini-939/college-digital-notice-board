
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-notice-board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: college-notice-board
  template:
    metadata:
      labels:
        app: college-notice-board
    spec:
      containers:
        - name: college-notice-board
          image: college-notice-board:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: SESSION_SECRET
              value: "8f3efbd48cc695a24791128ccf87cb75a35c1a6b728a52706f836b97b248c561"
---
apiVersion: v1
kind: Service
metadata:
  name: college-notice-board-service
spec:
  type: NodePort
  selector:
    app: college-notice-board
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30090
